# Déploiement du site statique vers Hostinger.
#
# Le site est 100 % statique (React + Vite, contenu dans src/data/) : il n'y a
# pas de serveur applicatif à lancer chez l'hébergeur. On construit donc le
# site dans le conteneur du projet (Dockerfile.dev, qui fournit le Chromium
# système du pré-rendu) puis on synchronise dist/ vers public_html en SFTP.
#
# Pourquoi ne pas utiliser le déploiement Git de hPanel (Advanced -> Git) ?
# Cette intégration ne lance aucun build : elle sert les fichiers du repo
# tels quels, donc le code source, pas le site. Le flux "Node.js web app" de
# hPanel fait bien le build, mais le pré-rendu (Chromium) n'y est pas
# disponible, et public_html y est réécrit intégralement à chaque déploiement
# (donc pas de contrôle sur le .htaccess ni sur ce qui est supprimé).
#
# Déclenchement : push sur main (= production) + lancement manuel.
# Voir docs/deploiement-hostinger.md pour la configuration initiale.

name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un déploiement à la fois : deux pushes rapprochés ne doivent pas se marcher
# dessus sur le serveur.
concurrency:
  group: deploiement-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brief-and-style-guide-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # VITE_SITE_URL alimente le canonical, l'Open Graph, robots.txt et
      # sitemap.xml au build (scripts/generate-seo-files.mjs). C'est une
      # valeur PUBLIQUE, déclarée en variable d'environnement du dépôt
      # (Settings -> Secrets and variables -> Actions -> Variables), pas en
      # secret.
      - name: Vérifier la configuration du build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          if [ -z "$VITE_SITE_URL" ]; then
            echo "::error::Variable VITE_SITE_URL absente. La créer dans Settings > Secrets and variables > Actions > Variables (ex. https://syncaconf.com, sans slash final)."
            exit 1
          fi
          if echo "$VITE_SITE_URL" | grep -q "TODO-DOMAINE-PRODUCTION"; then
            echo "::error::VITE_SITE_URL est encore le placeholder de .env.production. Le canonical, l'OG, robots.txt et le sitemap seraient cassés en production. Renseigner le vrai domaine dans la variable du dépôt ET dans .env.production."
            exit 1
          fi
          echo "VITE_SITE_URL = $VITE_SITE_URL"

      # Même image que le dev local (make prod-build) : le build CI est donc
      # identique au build que le projet produit chez lui, Chromium compris.
      - name: Construire l'image
        run: docker build -f Dockerfile.dev -t synca-build-ci .

      - name: Build de production + pré-rendu
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          docker run --rm \
            -e VITE_SITE_URL="${{ vars.VITE_SITE_URL }}" \
            -v "$PWD/dist:/out" \
            synca-build-ci \
            sh -c "npm run build && cp -a dist/. /out/"

      - name: Vérifier le contenu de dist/
        run: |
          echo "--- fichiers générés ---"
          find dist -type f | sort
          echo "--- taille ---"
          du -sh dist
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/.htaccess

      - name: Transmettre l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: brief-and-style-guide-main/dist
          retention-days: 7
          if-no-files-found: error

  deploiement:
    name: Déploiement SFTP
    needs: build
    runs-on: ubuntu-latest
    # Permet d'ajouter une approbation manuelle avant mise en ligne
    # (Settings -> Environments) une fois la mise en prod stabilisée.
    environment: production
    defaults:
      run:
        working-directory: brief-and-style-guide-main
    steps:
      - name: Récupérer l'artefact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: brief-and-style-guide-main/dist

      # Clé SSH dédiée au déploiement, jamais celle d'un poste de dev.
      # La clé privée vit uniquement dans les secrets du dépôt.
      - name: Installer la clé SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.HOSTINGER_SSH_PORT }}" "${{ vars.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Clé SSH installée."

      # rsync --delete : indispensable, les noms d'assets Vite sont hashés et
      # les anciens fichiers s'accumuleraient sinon. public_html ne doit
      # contenir que ce site.
      - name: Synchroniser vers public_html
        env:
          HOST: ${{ vars.HOSTINGER_HOST }}
          PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          REMOTE_DIR: ${{ vars.HOSTINGER_REMOTE_DIR }}
        run: |
          set -euo pipefail
          rsync -az --delete --checksum \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$USER@$HOST:$REMOTE_DIR/"
          echo "Synchronisation terminée vers $USER@$HOST:$REMOTE_DIR/"

      - name: Vérifier le site en ligne
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          set -euo pipefail
          for path in / /programme /speakers /contact /faq /robots.txt /sitemap.xml; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$VITE_SITE_URL$path" || echo 000)
            echo "$path -> HTTP $status"
            test "$status" = "200" || { echo "::error::$path ne répond pas en 200 (HTTP $status)"; exit 1; }
          done
          # Une URL inexistante doit répondre 404, pas 200 : c'est ce que la
          # règle R=404 du .htaccess garantit.
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$VITE_SITE_URL/page-inexistante-xyz" || echo 000)
          echo "/page-inexistante-xyz -> HTTP $status (attendu : 404)"
          test "$status" = "404" || { echo "::error::Une URL inexistante renvoie $status au lieu de 404"; exit 1; }
