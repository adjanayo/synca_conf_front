name: synca-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: synca-dev-web
    container_name: synca-dev-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

# Naming rule for every Docker project: <project>-<env>-<what>.
networks:
  default:
    name: synca-dev-network
